services:
  - type: web
    name: captcha-solver-testbed
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT
        value: 30/minute
      # Optional: To persist user accounts permanently across restarts,
      # add a free Postgres connection string:
      # - key: DATABASE_URL
      #   value: postgresql://...
