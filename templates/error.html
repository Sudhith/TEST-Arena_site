{% extends "base.html" %}

{% block title %}Error {{ status_code }} — TEST ARENA{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
  <div class="text-center max-w-md glass-panel p-10 border-rose-500/20 shadow-2xl">
    <div class="w-14 h-14 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto mb-4 text-rose-400">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <p class="text-6xl font-black font-display text-rose-400 mb-2">{{ status_code }}</p>
    <h1 class="text-xl font-bold text-white mb-2">{{ title }}</h1>
    <p class="text-zinc-400 text-xs leading-relaxed mb-6">{{ detail }}</p>
    <div class="flex gap-3 justify-center">
      <a href="/" class="btn-emerald px-5 py-2.5 text-xs">
        &larr; Return to Home
      </a>
      <a href="/login-digit" class="btn-ghost px-5 py-2.5 text-xs rounded-xl">
        Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
