<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CAPTCHA Solver Testbed{% endblock %}</title>

  <!-- Tailwind CSS (CDN — no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#6366f1', // indigo-500
              dark:    '#4f46e5', // indigo-600
            }
          }
        }
      }
    }
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/css/style.css">

  {% block head %}{% endblock %}
</head>

<body class="dark bg-gray-900 text-gray-100 min-h-full flex flex-col">

  <!-- Navigation -->
  <nav class="border-b border-gray-700 bg-gray-800/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-white font-bold text-lg hover:text-indigo-300 transition-colors">
        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        TEST ARENA
      </a>

      <div class="flex items-center gap-4 text-sm">
        <a href="/login-digit" class="text-gray-300 hover:text-white transition-colors">Digit Login</a>
        <a href="/login-grid"  class="text-gray-300 hover:text-white transition-colors">Grid Login</a>
        <a href="/register"    class="text-gray-300 hover:text-white transition-colors">Register</a>
        {% if current_user %}
        <a href="/dashboard"   class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
        <a href="/logout"
           class="bg-red-700 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-md transition-colors">
          Logout
        </a>
        {% endif %}
        <a href="/docs" target="_blank"
           class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-md transition-colors">
          API Docs
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-600">
    CAPTCHA Solver Testbed &mdash; AI Research Platform &mdash;
    <a href="https://github.com/Sudhith/TEST-Arena_site" target="_blank"
       class="hover:text-gray-400 transition-colors">GitHub</a>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
