{% extends "base.html" %}

{% block title %}Register Account — TEST ARENA{% endblock %}

{% block content %}
<div class="min-h-[82vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <div class="glass-panel p-8 sm:p-10 shadow-2xl relative">

      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4 text-emerald-400 shadow-lg shadow-emerald-950/50">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Create Tester Account</h1>
        <p class="text-xs text-zinc-400 mt-1">Autonomous Test Arena Access</p>
      </div>

      {% for msg in messages %}
      <div class="mb-5 px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-2
        {% if msg.category == 'success' %}bg-emerald-500/10 text-emerald-300 border border-emerald-500/30
        {% else %}bg-rose-500/10 text-rose-300 border border-rose-500/30{% endif %}">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ msg.message }}</span>
      </div>
      {% endfor %}

      <form method="post" action="/register" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Username</label>
          <input id="username" name="username" type="text" required minlength="3" maxlength="64"
            value="{{ form_username | default('') }}"
            class="w-full bg-[#0d0f15] border border-white/[0.1] text-white rounded-xl px-4 py-2.5 text-sm
                   placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
            placeholder="benchmark_agent_1">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Password</label>
          <input id="password" name="password" type="password" required minlength="8"
            class="w-full bg-[#0d0f15] border border-white/[0.1] text-white rounded-xl px-4 py-2.5 text-sm
                   placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
            placeholder="Minimum 8 characters">
        </div>

        <div>
          <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
            class="w-full bg-[#0d0f15] border border-white/[0.1] text-white rounded-xl px-4 py-2.5 text-sm
                   placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
            placeholder="Re-enter password">
        </div>

        <button type="submit"
          class="btn-emerald w-full py-3 text-sm flex items-center justify-center gap-2 mt-2">
          <span>Complete Registration</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-white/[0.08] text-center text-xs text-zinc-400">
        Already registered?
        <a href="/login-digit" class="text-emerald-400 hover:text-emerald-300 font-semibold underline decoration-emerald-500/40 ml-1">
          Sign In Here &rarr;
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
