{% extends "base.html" %}
{% block title %}Register — TEST ARENA{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-8">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600 mb-4">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Create Account</h1>
        <p class="text-gray-400 text-sm mt-1">Join the TEST ARENA</p>
      </div>

      {% for msg in messages %}
      <div class="mb-4 px-4 py-3 rounded-lg text-sm
        {% if msg.category == 'success' %}bg-green-900 text-green-200 border border-green-700
        {% else %}bg-red-900 text-red-200 border border-red-700{% endif %}">
        {{ msg.message }}
      </div>
      {% endfor %}

      <form method="post" action="/register" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
          <input id="username" name="username" type="text" required minlength="3" maxlength="64"
            value="{{ form_username | default('') }}"
            class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="choose a username">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
          <input id="password" name="password" type="password" required minlength="8"
            class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="at least 8 characters">
        </div>

        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
            class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="repeat your password">
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold
                 rounded-lg py-3 transition-colors duration-150">
          Create Account
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-400">
        Already have an account?
        <a href="/login-digit" class="text-indigo-400 hover:text-indigo-300">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
